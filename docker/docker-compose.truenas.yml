name: mealie-custom

services:
  mealie:
    # :mealie-next is a moving tag (always latest build from the branch).
    # For rollback safety, pin an immutable tag instead, e.g.:
    #   image: ghcr.io/einbrecher/mealie:v1.1.0-7-ga182b55
    # Available immutable tags: semver tags, git-describe tags, and full commit SHAs.
    image: ghcr.io/einbrecher/mealie:mealie-next
    container_name: mealie-custom
    restart: unless-stopped
    ports:
      - "9925:9000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PUID: 568
      PGID: 568
      TZ: America/New_York
      BASE_URL: http://192.168.1.42:9925
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      TOKEN_TIME: 87600
    volumes:
      - mealie-data:/app/data/

  postgres:
    image: postgres:16-alpine
    container_name: mealie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
      POSTGRES_DB: mealie
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mealie-data:
  mealie-pgdata:
